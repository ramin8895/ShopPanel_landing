name: Deploy landing (nexcart.ir)

# هر بار که چیزی روی main merge/push شود: چک تایپ → دیپلوی روی سرور.
# راه‌اندازی یک‌باره (کلید SSH و secrets): deploy/CI.md در ریپوی بک‌اند.
on:
  push:
    branches: [main]
  workflow_dispatch:

# دو دیپلوی هم‌زمان هیچ‌وقت هم‌پوشانی نکنند؛ دومی صبر می‌کند (لغو نمی‌شود)
concurrency:
  group: deploy-landing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify build output
        run: |
          pages=$(find out -name index.html | wc -l)
          echo "pages: $pages"
          test -f out/index.html && test -f out/404.html && test -f out/sitemap.xml
          test "$pages" -ge 25
      - uses: actions/upload-artifact@v4
        with:
          name: landing-out
          path: out
          retention-days: 3

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: landing-out
          path: out
      - name: Setup SSH
        env:
          SSH_KEY: ${{{{ secrets.SSH_KEY }}}}
          SSH_KNOWN_HOSTS: ${{{{ secrets.SSH_KNOWN_HOSTS }}}}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Backup and sync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          LANDING_ROOT: ${{ vars.LANDING_ROOT || '/var/www/nexcart/saas-store-landing' }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -p ${SSH_PORT:-22} -o BatchMode=yes"
          # بکاپ سبک (۵ نسخه‌ی آخر نگه داشته می‌شود)؛ نبودنِ دسترسی نوشتن کنار ریشه، دیپلوی را متوقف نمی‌کند
          $SSH "$SSH_USER@$SSH_HOST" "cp -a '$LANDING_ROOT' '$LANDING_ROOT.bak-$(date +%F-%H%M%S)' && ls -dt '$LANDING_ROOT'.bak-* | tail -n +6 | xargs -r rm -rf" \
            || echo "::warning::بکاپ لندینگ گرفته نشد"
          rsync -az --delete --chmod=D755,F644 -e "$SSH" out/ "$SSH_USER@$SSH_HOST:$LANDING_ROOT/"
          echo "synced out/ -> $LANDING_ROOT"
      - name: Purge Cloudflare cache (optional)
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "CF_ZONE_ID/CF_API_TOKEN تنظیم نیست؛ کش را دستی پاک کن."
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' >/dev/null && echo "cloudflare: purged"
